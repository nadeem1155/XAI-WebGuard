[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-webguard"
version = "0.1.0"
description = "Explainable detection of SQL injection and cross-site scripting"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "xgboost", "pyyaml", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
